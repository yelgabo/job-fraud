name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The playwright dependency's postinstall would otherwise download browsers;
      # nothing in the type-check, tests, or build launches one.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs prisma generate, which tsc and the build both need.
      - run: npm ci

      # Every deploy runs `prisma db push --accept-data-loss`, so a schema change that drops a
      # column or table destroys production data at deploy time with no prompt (2026-10-23).
      # Diffing the schema files needs no database. A deliberate drop is allowed when the commit
      # message (push) or PR title contains [allow-schema-drop].
      - name: Schema drop check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE:prisma/schema.prisma" 2>/dev/null; then
            echo "no base schema to compare"; exit 0
          fi
          git show "$BASE:prisma/schema.prisma" > /tmp/base.prisma
          npx prisma migrate diff --from-schema-datamodel /tmp/base.prisma \
            --to-schema-datamodel prisma/schema.prisma --script > /tmp/schema.sql
          cat /tmp/schema.sql
          if grep -qiE '\bDROP\b' /tmp/schema.sql; then
            case "$MESSAGE" in *"[allow-schema-drop]"*) echo "drop allowed by [allow-schema-drop]";;
              *) echo "::error::this schema change drops data on deploy (see SQL above)"; exit 1;; esac
          fi

      - name: Type-check
        run: npx tsc --noEmit

      # Tests are DB-free and network-free by design (mocked SDK, colocated under lib/).
      - name: Unit tests
        run: npm test

      # lib/env.ts zod-parses DATABASE_URL at import, so the build needs a value
      # present, but no page connects to it at build time (all DB-backed routes are
      # force-dynamic or empty-params ISR).
      - name: Build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npm run build
